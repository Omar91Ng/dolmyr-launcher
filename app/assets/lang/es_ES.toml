[js.dolm]
nombre = "Dolm"
bienvenida = [
    "¿Otro forastero? Pasa, pasa. Pulsa Continuar y no te pierdas.",
    "Vaya, alguien nuevo. Soy Dolm. Vigilo la entrada al Yermo. Sigue, que no muerdo.",
]
