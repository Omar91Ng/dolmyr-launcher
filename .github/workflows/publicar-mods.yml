# Publica la lista de mods (distribution.json) en la rama "lista-de-mods".
#
# Cómo se usa: edita distribucion/config.json (añadir, quitar o actualizar mods) o distribucion/archivos/,
# y haz push a main. Este flujo genera la lista (comprobando cada archivo en Modrinth) y la sube a la rama.
# El launcher la lee de https://raw.githubusercontent.com/Omar91Ng/dolmyr-launcher/lista-de-mods/distribution.json
# A partir de ahí:
#   - los launchers abiertos se enteran en un par de minutos y Dolm avisa de que hay mods nuevos,
#   - al pulsar JUGAR se descargan solos,
#   - el servidor (NetworkLauncher) ve la revisión nueva y pide a todos que pasen por el launcher antes de entrar.
#
# Sin GitHub Actions se hace igual desde el equipo: npm run distribucion && npm run publicar-lista
name: Publicar mods

on:
  push:
    branches: [main]
    paths:
      - 'distribucion/**'
      - 'herramientas/generar-distribucion.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-mods
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generar la lista de mods
        run: node herramientas/generar-distribucion.js

      - name: Subir la lista a la rama lista-de-mods
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node herramientas/publicar-lista.js
